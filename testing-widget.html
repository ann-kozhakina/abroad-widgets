<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогресс тестирования — AB Road</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bordeaux: #5C1A3A;
  --teal: #2BBFBF;
  --bg: #FDFCFA;
  --bg2: #F5F3EF;
  --white: #FFFFFF;
  --text: #1A1219;
  --text-muted: #9A8A95;
  --text-hint: #C4B4BF;
  --border: rgba(26,18,25,0.08);
  --font-head: 'Unbounded', sans-serif;
  --font-body: 'Mulish', sans-serif;
}

body {
  font-family: var(--font-body);
  background: transparent;
  color: var(--text);
  padding: 0;
}

/* ─── PROGRESS CARD ─── */
.progress-card {
  background: var(--white);
  border: 0.5px solid var(--border);
  border-radius: 14px;
  padding: 24px 28px 20px;
  margin-bottom: 16px;
}

.progress-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
}

.progress-left {}

.progress-eyebrow {
  font-family: var(--font-head);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-hint);
  margin-bottom: 8px;
}

.progress-numbers {
  display: flex;
  align-items: baseline;
  gap: 6px;
  line-height: 1;
}

.progress-count {
  font-family: var(--font-head);
  font-size: 44px;
  font-weight: 700;
  color: var(--bordeaux);
  letter-spacing: -0.02em;
}

.progress-of {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 400;
  color: var(--text-hint);
}

.progress-label-right {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.pct-badge {
  background: rgba(43,191,191,0.1);
  border: 0.5px solid rgba(43,191,191,0.25);
  color: var(--teal);
  font-family: var(--font-head);
  font-size: 16px;
  font-weight: 700;
  padding: 10px 18px;
  border-radius: 12px;
  flex-shrink: 0;
  align-self: flex-start;
  letter-spacing: -0.01em;
}

.progress-bar-wrap {
  margin-bottom: 10px;
}

.bar-track {
  height: 6px;
  background: var(--bg2);
  border-radius: 100px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--bordeaux) 0%, var(--teal) 100%);
  border-radius: 100px;
  transition: width 1s cubic-bezier(.4,0,.2,1);
  min-width: 2px;
}

.progress-footer {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--text-hint);
}

/* ─── LEADERBOARD ─── */
.section-eyebrow {
  font-family: var(--font-head);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-hint);
  margin-bottom: 10px;
}

.leaderboard {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.leader-row {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--white);
  border: 0.5px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  transition: border-color 0.15s, transform 0.1s;
}

.leader-row:hover {
  border-color: rgba(43,191,191,0.3);
  transform: translateX(2px);
}

.leader-row.top-1 { border-left: 2.5px solid #D4970A; }
.leader-row.top-2 { border-left: 2.5px solid #9E9E9E; }
.leader-row.top-3 { border-left: 2.5px solid #B87333; }

.rank-icon {
  font-size: 16px;
  width: 24px;
  text-align: center;
  flex-shrink: 0;
}

.rank-num {
  font-family: var(--font-head);
  font-size: 10px;
  font-weight: 700;
  color: var(--text-hint);
  width: 24px;
  text-align: center;
  flex-shrink: 0;
}

.leader-info {
  flex: 1;
  min-width: 0;
}

.leader-name {
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.leader-meta {
  font-size: 10px;
  color: var(--text-muted);
}

.leader-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.mini-bar {
  width: 52px;
  height: 3px;
  background: var(--bg2);
  border-radius: 100px;
  overflow: hidden;
}

.mini-bar-fill {
  height: 100%;
  border-radius: 100px;
}

.fill-gold   { background: linear-gradient(90deg, #D4970A, #F5C842); }
.fill-silver { background: linear-gradient(90deg, #9E9E9E, #CFCFCF); }
.fill-bronze { background: linear-gradient(90deg, #B87333, #D4956A); }
.fill-default { background: linear-gradient(90deg, var(--bordeaux), var(--teal)); }

.score-badge {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 700;
  min-width: 40px;
  text-align: right;
}

.score-gold   { color: #C68400; }
.score-silver { color: #7A7A7A; }
.score-bronze { color: #9B5C1A; }
.score-default { color: var(--bordeaux); }

/* ─── STATES ─── */
.empty-msg {
  text-align: center;
  padding: 24px 16px;
  color: var(--text-hint);
  font-size: 12px;
  font-style: italic;
  background: var(--white);
  border: 0.5px solid var(--border);
  border-radius: 10px;
}

.loading-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 40px 20px;
  color: var(--text-hint);
  font-size: 12px;
}

.spinner {
  width: 22px;
  height: 22px;
  border: 2px solid var(--bg2);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ─── FOOTER ─── */
.widget-footer {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  margin-top: 12px;
}

.live-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--teal);
  animation: blink 2.4s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

.footer-text {
  font-size: 10px;
  color: var(--text-hint);
}

.retry-btn {
  font-size: 10px;
  color: var(--teal);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  font-family: var(--font-body);
}

.error-card {
  background: rgba(92,26,58,0.04);
  border: 0.5px solid rgba(92,26,58,0.15);
  border-radius: 12px;
  padding: 20px 24px;
  color: var(--bordeaux);
  font-size: 12px;
  line-height: 1.6;
}

.error-card strong {
  font-family: var(--font-head);
  font-size: 11px;
  display: block;
  margin-bottom: 6px;
}
</style>
</head>
<body>

<div id="widget">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <span>Загружаем данные…</span>
  </div>
</div>

<script>
// ─── КОНФИГ ───────────────────────────────────────────────
const SHEET_ID            = '1AvTpRonttEi1WWHFnKm1FIXVYZb9oJ3p99SURJwUDh4';
const TOTAL_STUDENTS      = 79;
const REFRESH_INTERVAL_MS = 20 * 60 * 1000; // 20 минут
// ──────────────────────────────────────────────────────────

// Google Visualization API — не имеет CORS-ограничений для публичных таблиц
function gvizUrl(sheetName) {
  return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
         '/gviz/tq?tqx=out:json&headers=1&sheet=' + encodeURIComponent(sheetName);
}

async function fetchTable(sheetName) {
  const resp = await fetch(gvizUrl(sheetName), { cache: 'no-store' });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  const text = await resp.text();
  const m = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
  if (!m) throw new Error('Неожиданный формат ответа');
  return JSON.parse(m[1]).table;
}

function cellStr(cell) {
  if (!cell) return '';
  return cell.v != null ? String(cell.v) : (cell.f || '');
}

function cellPct(cell) {
  if (!cell) return null;
  // Google хранит % как дробь: 78% → 0.78
  if (typeof cell.v === 'number') {
    return cell.v <= 1 ? Math.round(cell.v * 100) : Math.round(cell.v);
  }
  if (cell.f) {
    const n = parseFloat(String(cell.f).replace('%','').replace(',','.'));
    return isNaN(n) ? null : n;
  }
  return null;
}

function tableToStudents(table, pctIdx) {
  const out = [];
  if (!table || !table.rows) return out;
  for (const row of table.rows) {
    if (!row.c) continue;
    const name = cellStr(row.c[3]).trim();
    if (!name) continue;
    out.push({
      name,
      level: cellStr(row.c[0]).trim(),
      group: cellStr(row.c[1]).trim(),
      pct:   cellPct(row.c[pctIdx])
    });
  }
  return out;
}

async function loadStudents() {
  const [t1, t2] = await Promise.all([
    fetchTable('Data'),
    fetchTable('Data_high')
  ]);
  return [
    ...tableToStudents(t1, 15),   // Data:      % = col P (idx 15)
    ...tableToStudents(t2, 18)    // Data_high: % = col S (idx 18)
  ];
}

function formatTime(d) {
  return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
}

function rankMeta(i) {
  if (i === 0) return { icon: '🥇', cls: 'top-1', fill: 'fill-gold',   score: 'score-gold'   };
  if (i === 1) return { icon: '🥈', cls: 'top-2', fill: 'fill-silver', score: 'score-silver' };
  if (i === 2) return { icon: '🥉', cls: 'top-3', fill: 'fill-bronze', score: 'score-bronze' };
  return       { icon: '',    cls: '',      fill: 'fill-default', score: 'score-default' };
}

function render(students, updatedAt) {
  const completed = students.length;
  const pct       = TOTAL_STUDENTS > 0 ? Math.min(100, Math.round((completed / TOTAL_STUDENTS) * 100)) : 0;
  const remaining = Math.max(0, TOTAL_STUDENTS - completed);

  // Топ-10 (≥ 70%), сортировка по убыванию
  const top10 = students
    .filter(s => s.pct !== null && s.pct >= 70)
    .sort((a, b) => b.pct - a.pct)
    .slice(0, 10);

  const leaderboardHTML = top10.length === 0
    ? `<div class="empty-msg">Пока нет результатов ≥ 70%</div>`
    : top10.map((s, i) => {
        const m = rankMeta(i);
        return `
          <div class="leader-row ${m.cls}">
            ${m.icon
              ? `<div class="rank-icon">${m.icon}</div>`
              : `<div class="rank-num">${i + 1}</div>`
            }
            <div class="leader-info">
              <div class="leader-name">${s.name}</div>
              <div class="leader-meta">${s.level}${s.group ? ' · ' + s.group : ''}</div>
            </div>
            <div class="leader-right">
              <div class="mini-bar">
                <div class="mini-bar-fill ${m.fill}" style="width:${s.pct}%"></div>
              </div>
              <div class="score-badge ${m.score}">${Math.round(s.pct)}%</div>
            </div>
          </div>`;
      }).join('');

  document.getElementById('widget').innerHTML = `
    <div class="progress-card">
      <div class="progress-top">
        <div class="progress-left">
          <div class="progress-eyebrow">Прогресс тестирования</div>
          <div class="progress-numbers">
            <span class="progress-count">${completed}</span>
            <span class="progress-of">&thinsp;/&thinsp;${TOTAL_STUDENTS}</span>
          </div>
          <div class="progress-label-right">детей сдали тест</div>
        </div>
        <div class="pct-badge">${pct}%</div>
      </div>
      <div class="progress-bar-wrap">
        <div class="bar-track">
          <div class="bar-fill" style="width:${pct}%"></div>
        </div>
      </div>
      <div class="progress-footer">
        <span>Завершили тестирование</span>
        <span>Ещё не сдали: ${remaining}</span>
      </div>
    </div>

    <div class="section-eyebrow">Топ-10 — результат ≥ 70%</div>
    <div class="leaderboard">${leaderboardHTML}</div>

    <div class="widget-footer">
      <div class="live-dot"></div>
      <span class="footer-text">Обновлено в ${updatedAt} · следующее через 20 мин</span>
    </div>
  `;
}

function renderError(msg) {
  document.getElementById('widget').innerHTML = `
    <div class="error-card">
      <strong>Не удалось загрузить данные</strong>
      ${msg}<br><br>
      Убедитесь, что в Google Таблице включён доступ <em>«Все, у кого есть ссылка — могут просматривать»</em>.
      <br><br>
      <button class="retry-btn" onclick="refresh()">Попробовать снова</button>
    </div>
  `;
}

async function refresh() {
  try {
    const students = await loadStudents();
    render(students, formatTime(new Date()));
  } catch (e) {
    console.error('Widget error:', e);
    renderError(e.message);
  }
}

// Первая загрузка + авто-обновление каждые 20 мин
refresh();
setInterval(refresh, REFRESH_INTERVAL_MS);
</script>
</body>
</html>
