<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Прогресс тестирования — AB Road</title><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0} :root{--bordeaux:#5C1A3A;--teal:#2BBFBF;--bg:transparent;--bg2:#F5F3EF;--white:#FFFFFF;--text:#1A1219;--text-muted:#9A8A95;--text-hint:#C4B4BF;--border:rgba(26,18,25,.08);--font-head:'Unbounded',sans-serif;--font-body:'Mulish',sans-serif} body{font-family:var(--font-body);color:var(--text);background:transparent}
/* ── LIVE TESTING WIDGET ── */
.live-widget-wrap {
  padding: 28px 48px 32px;
  border-bottom: 0.5px solid var(--border);
  background: var(--bg);
}
@media (max-width: 700px) { .live-widget-wrap { padding: 20px 20px 24px; } }

.lw-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 16px;
}
@media (max-width: 800px) { .lw-grid { grid-template-columns: 1fr; } }

/* левая — кольцо */
.lw-left {
  background: var(--white); border: 0.5px solid var(--border);
  border-radius: 18px; padding: 24px 20px 22px;
  display: flex; flex-direction: column; align-items: center;
}
.lw-live-row {
  display: flex; align-items: center; gap: 7px;
  align-self: flex-start; width: 100%; margin-bottom: 22px;
}
.lw-pulse {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--teal); flex-shrink: 0;
  animation: lwBlink 2.4s ease-in-out infinite;
}
@keyframes lwBlink { 0%,100%{opacity:1} 50%{opacity:.2} }
.lw-upd-txt { font-size: 10px; color: var(--text-hint); }

.lw-ring-wrap {
  position: relative; width: 180px; height: 180px; margin-bottom: 16px;
}
.lw-ring-svg { transform: rotate(-90deg); display: block; }
.lw-ring-track { fill: none; stroke: var(--bg2); stroke-width: 14; }
.lw-ring-fill {
  fill: none; stroke-width: 14; stroke-linecap: round;
  stroke: url(#lwGrad);
  stroke-dasharray: 502;
  stroke-dashoffset: 502;
  transition: stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1);
}
.lw-ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
}
.lw-ring-num {
  font-family: var(--font-head); font-size: 46px; font-weight: 700;
  color: var(--bordeaux); line-height: 1; letter-spacing: -.02em;
}
.lw-ring-denom {
  font-family: var(--font-head); font-size: 14px; font-weight: 400;
  color: var(--text-hint); margin-top: 2px;
}
.lw-ring-caption {
  font-family: var(--font-head); font-size: 11px; font-weight: 700;
  color: var(--bordeaux); text-align: center;
}

/* правая — список */
.lw-right {
  background: var(--white); border: 0.5px solid var(--border);
  border-radius: 18px; padding: 22px 24px;
}
.lw-board-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.lw-board-title {
  font-family: var(--font-head); font-size: 9px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--text-hint);
}
.lw-board-tag {
  font-size: 10px; color: var(--teal); font-weight: 700;
  background: rgba(43,191,191,.1); border-radius: 20px; padding: 3px 10px;
}
/* карточки — сетка */
.lw-list {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
}
@media (max-width: 900px) { .lw-list { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 600px) { .lw-list { grid-template-columns: repeat(2, 1fr); } }
.lw-item {
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(43,191,191,.07);
  border: 0.5px solid transparent; border-radius: 12px; padding: 12px 14px;
  transition: background .12s, border-color .12s;
}
.lw-item:hover { background: rgba(43,191,191,.13); border-color: rgba(43,191,191,.3); }
.lw-item.hidden { display: none; }
/* верхняя строка карточки: ранг + счёт */
.lw-card-top {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
}
.lw-medal { font-size: 18px; line-height: 1; }
.lw-num {
  font-family: var(--font-head); font-size: 11px; font-weight: 700;
  color: var(--text-hint); min-width: 20px;
}
.lw-score {
  font-family: var(--font-head); font-size: 20px; font-weight: 700;
  color: var(--bordeaux); line-height: 1; letter-spacing: -.02em;
}
.lw-score .u { font-size: 11px; font-weight: 400; opacity: .45; }
/* имя */
.lw-name {
  font-family: var(--font-head); font-size: 11px; font-weight: 700;
  color: var(--text); line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
/* бейджи */
.lw-tags { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 2px; }
.lw-lvl {
  display: inline-flex; font-size: 8px; font-weight: 700;
  font-family: var(--font-head); padding: 2px 6px; border-radius: 4px;
  letter-spacing: .04em; text-transform: uppercase; flex-shrink: 0;
}
.lw-ls { background: rgba(212,133,10,.12); color: #9A5C00; }
.lw-lm { background: rgba(107,53,168,.10); color: #5A2080; }
.lw-lf { background: rgba(42,122,42,.10);  color: #1A6020; }
.lw-lk { background: rgba(26,106,154,.12); color: #0A4A7A; }
.lw-lp { background: rgba(139,31,90,.10);  color: #6A0040; }
.lw-lo { background: var(--bg2); color: var(--text-muted); }
.lw-group { font-size: 10px; color: var(--text-muted); }

/* ── фильтры под кольцом ── */
.lw-divider { width: 100%; height: 0.5px; background: var(--border); margin: 18px 0 14px; }
.lw-filter-label {
  font-family: var(--font-head); font-size: 8px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-hint); margin-bottom: 8px; align-self: flex-start;
}
.lw-filter-btns { display: flex; flex-wrap: wrap; gap: 5px; width: 100%; margin-bottom: 10px; }
.lw-fbtn {
  font-family: var(--font-head); font-size: 8px; font-weight: 700;
  letter-spacing: .03em; text-transform: uppercase;
  border: 1.5px solid transparent; border-radius: 6px;
  padding: 5px 9px; cursor: pointer; line-height: 1;
  transition: all .15s; opacity: .45; background: transparent;
}
.lw-fbtn:hover { opacity: .75; }
.lw-fbtn.active { opacity: 1; }
.lw-fbtn.f-all              { color: var(--teal); border-color: rgba(43,191,191,.35); opacity: 1; }
.lw-fbtn.f-all.active       { background: rgba(43,191,191,.15); border-color: var(--teal); }
.lw-fbtn.f-ls               { color: #9A5C00; border-color: rgba(212,133,10,.3); }
.lw-fbtn.f-ls.active        { background: rgba(212,133,10,.15); border-color: #D4850A; opacity: 1; }
.lw-fbtn.f-lm               { color: #5A2080; border-color: rgba(107,53,168,.3); }
.lw-fbtn.f-lm.active        { background: rgba(107,53,168,.15); border-color: #6B35A8; opacity: 1; }
.lw-fbtn.f-lf               { color: #1A6020; border-color: rgba(42,122,42,.3); }
.lw-fbtn.f-lf.active        { background: rgba(42,122,42,.15); border-color: #2A7A2A; opacity: 1; }
.lw-fbtn.f-lk               { color: #0A4A7A; border-color: rgba(26,106,154,.3); }
.lw-fbtn.f-lk.active        { background: rgba(26,106,154,.15); border-color: #1A6A9A; opacity: 1; }
.lw-fbtn.f-lp               { color: #6A0040; border-color: rgba(139,31,90,.3); }
.lw-fbtn.f-lp.active        { background: rgba(139,31,90,.15); border-color: #8B1F5A; opacity: 1; }
/* счётчик результата */
.lw-result-val {
  font-family: var(--font-head); font-size: 12px; font-weight: 700;
  color: var(--text); align-self: flex-start; line-height: 1;
}
.lw-result-pct { color: var(--bordeaux); }

.lw-empty { text-align: center; padding: 28px 12px; font-size: 11px; color: var(--text-hint); font-style: italic; }
.lw-loading { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px; color: var(--text-hint); font-size: 11px; }
.lw-spinner { width: 18px; height: 18px; border: 2px solid var(--bg2); border-top-color: var(--teal); border-radius: 50%; animation: spin .75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

</style></head><body>
  <!-- ── LIVE TESTING WIDGET ── -->
  <div class="live-widget-wrap" style="--delay:0.04s">
    <div class="lw-grid">

      <!-- кольцо -->
      <div class="lw-left">
        <div class="lw-live-row">
          <div class="lw-pulse"></div>
          <div class="lw-upd-txt" id="lw-upd">обновляется…</div>
        </div>
        <div class="lw-ring-wrap">
          <svg class="lw-ring-svg" width="180" height="180" viewBox="0 0 180 180">
            <defs>
              <linearGradient id="lwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"   stop-color="#2BBFBF"/>
                <stop offset="100%" stop-color="#5C1A3A"/>
              </linearGradient>
            </defs>
            <circle class="lw-ring-track" cx="90" cy="90" r="80"/>
            <circle class="lw-ring-fill"  cx="90" cy="90" r="80" id="lw-arc"/>
          </svg>
          <div class="lw-ring-center">
            <div class="lw-ring-num"  id="lw-done">—</div>
            <div class="lw-ring-denom" id="lw-denom">/ —</div>
          </div>
        </div>
        <div class="lw-ring-caption" id="lw-caption">—% сдали тест</div>

      </div>

      <!-- список -->
      <div class="lw-right">
<div class="compact-controls"><div class="lw-filter-label">уровень</div>
        <div class="lw-filter-btns">
          <button class="lw-fbtn f-all active" data-lvl="all">Все</button>
          <button class="lw-fbtn f-ls" data-lvl="ls">Starters</button>
          <button class="lw-fbtn f-lm" data-lvl="lm">Movers</button>
          <button class="lw-fbtn f-lf" data-lvl="lf">Flyers</button>
          <button class="lw-fbtn f-lk" data-lvl="lk">KEY</button>
          <button class="lw-fbtn f-lp" data-lvl="lp">PET</button>
        </div>
<div class="compact-result"><div class="lw-filter-label">Набрали ≥70%</div><div class="lw-result-val" id="lw-filter-count">—</div></div></div>
        <div class="lw-board-head">
          <div class="lw-board-title" id="lw-board-title">Топ-30 · результат ≥ 70%</div>
          <div class="lw-board-tag">Осень 2026</div>
        </div>
        <div id="lw-board">
          <div class="lw-loading"><div class="lw-spinner"></div><span>Загружаем…</span></div>
        </div>
      </div>

    </div>
  </div>

<script>
(function() {
  const SHEET_ID   = '1AvTpRonttEi1WWHFnKm1FIXVYZb9oJ3p99SURJwUDh4';
  const TOTAL      = 74;
  const REFRESH_MS = 20 * 60 * 1000;

  // Google Visualization API — работает без CORS с любого домена
  function gvizUrl(sheetName) {
    return 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
           '/gviz/tq?tqx=out:json&headers=1&sheet=' + encodeURIComponent(sheetName);
  }

  async function fetchTable(sheetName) {
    const resp = await fetch(gvizUrl(sheetName), { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    // Ответ завёрнут: google.visualization.Query.setResponse({...});
    const m = text.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
    if (!m) throw new Error('Неожиданный формат ответа от Google');
    return JSON.parse(m[1]).table;
  }

  function cellStr(cell) {
    if (!cell) return '';
    return cell.v != null ? String(cell.v) : (cell.f || '');
  }

  function cellPct(cell) {
    if (!cell) return null;
    // Google хранит % как десятичную дробь (78% → 0.78)
    if (typeof cell.v === 'number') {
      return cell.v <= 1 ? Math.round(cell.v * 100) : Math.round(cell.v);
    }
    if (cell.f) {
      const n = parseFloat(String(cell.f).replace('%','').replace(',','.'));
      return isNaN(n) ? null : n;
    }
    return null;
  }

  function tableToStudents(table, pctIdx) {
    const out = [];
    if (!table || !table.rows) return out;
    for (const row of table.rows) {
      if (!row.c) continue;
      const name = cellStr(row.c[3]).trim();   // col D
      if (!name) continue;
      out.push({
        name,
        level: cellStr(row.c[0]).trim(),        // col A
        group: cellStr(row.c[1]).trim(),         // col B
        pct:   cellPct(row.c[pctIdx])
      });
    }
    return out;
  }

  async function loadAll() {
    const [t1, t2] = await Promise.all([
      fetchTable('Data'),
      fetchTable('Data_high')
    ]);
    return [
      ...tableToStudents(t1, 15),   // Data:      % = col P (idx 15)
      ...tableToStudents(t2, 18)    // Data_high: % = col S (idx 18)
    ];
  }

  const CIRC = 2 * Math.PI * 80; // 502.6

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  }

  function lwLvlClass(lvl) {
    const l = lvl.toLowerCase();
    if (l.includes('starter')) return 'lw-ls';
    if (l.includes('mover'))   return 'lw-lm';
    if (l.includes('flyer'))   return 'lw-lf';
    if (l.includes('key'))     return 'lw-lk';
    if (l.includes('prelim') || l.includes('pet')) return 'lw-lp';
    return 'lw-lo';
  }

  // ── фильтр ──
  const activeFilters  = new Set();
  let   lwWroteTotal   = 0;
  let lwPassed = [];
  const lwWroteByLevel = {};
  const LVL_NAMES = { ls:'Starters', lm:'Movers', lf:'Flyers', lk:'KEY', lp:'PET' };

  function lwApplyFilter() {
    const title   = document.getElementById('lw-board-title');
    const counter = document.getElementById('lw-filter-count');
    const items   = document.querySelectorAll('#lw-board .lw-item');
    let visible = 0, wroteTotal = 0;

    if (activeFilters.size === 0) {
      items.forEach(el => el.classList.remove('hidden'));
      visible    = items.length;
      wroteTotal = lwWroteTotal;
      if (title) title.textContent = 'Топ-30 · результат ≥ 70%';
    } else {
      items.forEach(el => {
        const key  = el.dataset.lvlclass.replace('lw-', '');
        const show = activeFilters.has(key);
        el.classList.toggle('hidden', !show);
        if (show) visible++;
      });
      activeFilters.forEach(k => { wroteTotal += (lwWroteByLevel[k] || 0); });
      const sel = [...activeFilters].map(k => LVL_NAMES[k]).join(', ');
      if (title) title.textContent = sel + ' · результат ≥ 70%';
    }

    visible = lwPassed.filter(s => activeFilters.size === 0 || activeFilters.has(lwLvlClass(s.level).replace('lw-', ''))).length;
    const sharePct = wroteTotal > 0 ? Math.round(visible / wroteTotal * 100) : 0;
    if (counter) counter.innerHTML =
      `${visible} из ${wroteTotal}, <span class="lw-result-pct">${sharePct}%</span>`;
  }

  function lwSetupFilters() {
    document.querySelectorAll('.lw-fbtn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lvl = btn.dataset.lvl;
        if (lvl === 'all') {
          activeFilters.clear();
          document.querySelectorAll('.lw-fbtn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        } else {
          document.querySelector('.lw-fbtn.f-all').classList.remove('active');
          if (activeFilters.has(lvl)) { activeFilters.delete(lvl); btn.classList.remove('active'); }
          else                        { activeFilters.add(lvl);    btn.classList.add('active'); }
          if (activeFilters.size === 0)
            document.querySelector('.lw-fbtn.f-all').classList.add('active');
        }
        lwApplyFilter();
      });
    });
  }

  async function lwRefresh() {
    try {
      const students = await loadAll();
      const completed = students.filter(s => s.pct !== null);
      const done = completed.length;
      const pct  = Math.min(100, Math.round(done / TOTAL * 100));

      // кольцо
      const arc = document.getElementById('lw-arc');
      if (arc) arc.style.strokeDashoffset = CIRC * (1 - pct / 100);
      const elDone = document.getElementById('lw-done');
      if (elDone) elDone.textContent = done;
      const elDenom = document.getElementById('lw-denom');
      if (elDenom) elDenom.textContent = '/ ' + TOTAL;
      const elCap = document.getElementById('lw-caption');
      if (elCap) elCap.textContent = pct + '% сдали тест';

      // время
      const t = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
      const elUpd = document.getElementById('lw-upd');
      if (elUpd) elUpd.textContent = 'обновлено в ' + t;

      // считаем написавших по уровням (для счётчика фильтра)
      lwWroteTotal = done;
      Object.keys(lwWroteByLevel).forEach(k => delete lwWroteByLevel[k]);
      completed.forEach(s => {
        const key = lwLvlClass(s.level).replace('lw-', '');
        lwWroteByLevel[key] = (lwWroteByLevel[key] || 0) + 1;
      });

      lwPassed = completed.filter(s => s.pct >= 70);
      // карточки топ-30
      const MEDALS = ['🥇','🥈','🥉'];
      const top30  = students
        .filter(s => s.pct !== null && s.pct >= 70)
        .sort((a, b) => b.pct - a.pct)
        .slice(0, 30);

      const board = document.getElementById('lw-board');
      if (!board) return;
      board.innerHTML = top30.length === 0
        ? '<div class="lw-empty">Пока нет результатов ≥ 70%</div>'
        : '<div class="lw-list">' + top30.map((s, i) => `
            <div class="lw-item" data-lvlclass="${lwLvlClass(s.level)}">
              <div class="lw-card-top">
                ${i < 3 ? `<div class="lw-medal">${MEDALS[i]}</div>` : `<div class="lw-num">${i+1}</div>`}
                <div class="lw-score">${Math.round(s.pct)}<span class="u">%</span></div>
              </div>
              <div class="lw-name">${escapeHtml(s.name)}</div>
              <div class="lw-tags">
                <span class="lw-lvl ${lwLvlClass(s.level)}">${escapeHtml(s.level)}</span>
                ${s.group ? `<span class="lw-group">${escapeHtml(s.group)}</span>` : ''}
              </div>
            </div>`).join('') + '</div>';

      // применяем текущий фильтр (сохраняется между обновлениями)
      lwApplyFilter();
    } catch(e) {
      const b = document.getElementById('lw-board');
      if (b) b.innerHTML = `<div class="lw-empty">Ошибка загрузки: ${e.message}</div>`;
    }
  }

  // запуск: фильтры однократно, данные сразу и каждые 20 мин
  lwSetupFilters();
  lwRefresh();
  setInterval(lwRefresh, REFRESH_MS);
})();
</script></body></html>
